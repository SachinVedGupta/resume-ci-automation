name: Build Resume
on:
  push:
    branches-ignore: [previews]
    paths-ignore: ['archive/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - run: uv sync --locked
      - name: Test variant resolution and validation
        run: uv run python -m unittest discover -s tests -v
      - name: Build and verify every resume
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: uv run python -m resume_ci_automation --all
      - uses: actions/upload-artifact@v4
        with:
          name: resumes-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Preview instructions
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo '### Resume build passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'All variants are one page with readable text. Download the artifact below for PDF, PNG and resolved YAML.' >> "$GITHUB_STEP_SUMMARY"
          echo "For branch pushes, the publish job adds [inline GitHub previews](https://github.com/$REPO/blob/previews/builds/$SHA/README.md). Pull requests from forks have downloadable artifacts only." >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: resume-preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: resumes-${{ github.sha }}
          path: generated
      - name: Save previews in this repository
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp -R generated "$RUNNER_TEMP/resume-output"
          if git ls-remote --exit-code --heads origin previews; then
            git fetch origin previews
            git checkout -B previews FETCH_HEAD
          else
            git checkout --orphan previews
            git rm -rf .
          fi
          mkdir -p "builds/$SOURCE_SHA"
          cp -R "$RUNNER_TEMP/resume-output/." "builds/$SOURCE_SHA/"
          CURRENT_HEAD=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$SOURCE_BRANCH" = "$DEFAULT_BRANCH" ] && [ "$SOURCE_SHA" = "$CURRENT_HEAD" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          sha=os.environ['SOURCE_SHA']
          source=Path('builds')/sha/'README.md'
          text=source.read_text().replace('](general/',f'](builds/{sha}/general/')
          import re
          text=re.sub(r'\]\((?!builds/)([^)]+)\)',lambda m: f'](builds/{sha}/{m[1]})',text)
          Path('README.md').write_text(text+f'\nSource commit: `{sha}`\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds
          if [ -f README.md ]; then git add README.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Preview resumes from $SOURCE_SHA"
            git push origin HEAD:previews
          fi
